name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────
  # Job 1: Format check & Security / Health Gates
  # ──────────────────────────────────────────────────────────
  lint-and-security:
    name: Lint, Code Health & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run lint

      # Placeholder for CodeScene integration
      - name: CodeScene Health Check
        run: |
          echo "Running CodeScene analysis..."
          # Replace with actual codescene-ci command
          # e.g., npx codescene-ci --thresholds .codescene-thresholds
          echo "CodeScene check passed."

      # Placeholder for Codacy Security Scan
      - name: Codacy Security Scan
        run: |
          echo "Running Codacy security scan..."
          # Replace with actual codacy analysis CLI
          # e.g., bash <(curl -Ls https://raw.githubusercontent.com/codacy/codacy-analysis-cli/master/bin/get.sh) analyze --fail-if-incomplete
          echo "Codacy scan passed."

  # ──────────────────────────────────────────────────────────
  # Job 2: TypeScript type-check + compile all packages
  # ──────────────────────────────────────────────────────────
  typecheck-and-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API codegen
        run: pnpm --filter @workspace/api-spec run codegen

      - name: Type check (all packages)
        run: pnpm run typecheck

      - name: Build all packages
        run: pnpm -r --if-present run build
        env:
          NODE_ENV: production

      - name: Package VS Code extension (.vsix)
        run: pnpm --filter docuvia-vscode run package

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: docuvia-vscode
          path: artifacts/vscode-client/*.vsix

  # ──────────────────────────────────────────────────────────
  # Job 3: Fast Smoke Tests (< 5 mins)
  # ──────────────────────────────────────────────────────────
  test-smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: docuvia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d docuvia_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/docuvia_test
      PORT: "8080"
      AI_INTEGRATIONS_OPENAI_API_KEY: test-key
      AI_INTEGRATIONS_OPENAI_BASE_URL: http://127.0.0.1:65535/v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API codegen
        run: pnpm --filter @workspace/api-spec run codegen

      - name: Push test database schema
        run: pnpm --filter @workspace/db run push

      - name: Run Smoke tests
        run: pnpm run test:smoke

  # ──────────────────────────────────────────────────────────
  # Job 4: Full Regression & Coverage Ratchet
  # ──────────────────────────────────────────────────────────
  test-regression:
    name: Regression & Coverage
    runs-on: ubuntu-latest
    needs: [test-smoke]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: docuvia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d docuvia_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/docuvia_test
      PORT: "8080"
      AI_INTEGRATIONS_OPENAI_API_KEY: test-key
      AI_INTEGRATIONS_OPENAI_BASE_URL: http://127.0.0.1:65535/v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API codegen
        run: pnpm --filter @workspace/api-spec run codegen

      - name: Push test database schema
        run: pnpm --filter @workspace/db run push

      - name: Run full tests with coverage ratchet
        # This will fail the job if thresholds (85% backend, 70% frontend) defined in vitest.config.ts are not met
        run: pnpm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage

  # ──────────────────────────────────────────────────────────
  # Job 5: E2E Playwright Tests (VS Code & Web UI)
  # ──────────────────────────────────────────────────────────
  test-e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [test-smoke, typecheck-and-build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run VS Code Client E2E Tests
        run: pnpm --filter docuvia-vscode run test:e2e

      # Run Web UI E2E if available
      # - name: Run Web UI E2E Tests
      #   run: pnpm --filter @workspace/kg-engine run test:e2e
