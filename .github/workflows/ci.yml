name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  typecheck-and-test:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm exec prettier --check .

      - name: Lint (complexity budget) -- fail-fast before slower checks
        run: pnpm run lint

      - name: Type check (all packages)
        run: pnpm run typecheck

      - name: Build (all packages)
        run: pnpm run build

      - name: Install rust-analyzer (live LSP integration test)
        # The ubuntu image ships rustup's rust-analyzer *proxy* in ~/.cargo/bin, so the provider's
        # `command -v` preflight resolves it and the live test runs -- but the actual component
        # isn't installed, and spawning the proxy fails with "Unknown binary 'rust-analyzer'". Add
        # it so the real-server documentSymbol/references assertions actually exercise rust-analyzer.
        run: rustup component add rust-analyzer

      - name: Run tests
        run: pnpm run test

  ocr-review:
    name: OpenCodeReview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (full history for merge-base diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install OpenCodeReview
        run: npm install -g @alibaba-group/open-code-review

      - name: Configure OCR (using secrets)
        env:
          OCR_PROVIDER: openrouter
          OCR_MODEL: openrouter/free
          OCR_CUSTOM_PROVIDERS_OPENROUTER_URL: https://openrouter.ai/api/v1
          OCR_CUSTOM_PROVIDERS_OPENROUTER_PROTOCOL: openai
          OCR_CUSTOM_PROVIDERS_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          ocr config set provider $OCR_PROVIDER
          ocr config set model $OCR_MODEL
          ocr config set custom_providers.openrouter.url $OCR_CUSTOM_PROVIDERS_OPENROUTER_URL
          ocr config set custom_providers.openrouter.protocol $OCR_CUSTOM_PROVIDERS_OPENROUTER_PROTOCOL
          ocr config set custom_providers.openrouter.api_key $OCR_CUSTOM_PROVIDERS_OPENROUTER_API_KEY
          ocr llm test  # 驗證連線

      - name: Resolve review range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --tags --force origin "${{ github.event.pull_request.base.ref }}"
            FROM="origin/${{ github.event.pull_request.base.ref }}"
            TO="${{ github.event.pull_request.head.sha }}"
          else
            FROM="${{ github.event.before }}"
            if [ -z "$FROM" ] || [ "$FROM" = "0000000000000000000000000000000000000000" ]; then
              # 分支建立的第一次 push：diff 基準改為 git 的 empty tree
              FROM="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
            fi
            TO="${{ github.sha }}"
          fi
          echo "FROM=$FROM" >> "$GITHUB_OUTPUT"
          echo "TO=$TO" >> "$GITHUB_OUTPUT"
          echo "Reviewing: $FROM -> $TO"

      - name: Run OCR Review
        id: review
        env:
          FROM: ${{ steps.range.outputs.FROM }}
          TO: ${{ steps.range.outputs.TO }}
        run: |
          # ocr review hits the free OpenRouter model, which is rate-limited/flaky; a single hard
          # failure used to red the whole PR for a transient LLM/API error. Retry with backoff,
          # then always surface the exit code + captured stderr instead of letting `set -e` swallow
          # them before the fallback `cat` can run.
          exit_code=1
          for attempt in 1 2 3; do
            echo "=== OCR review attempt $attempt/3 ==="
            if ocr review \
              --from "$FROM" \
              --to "$TO" \
              --format json \
              --audience agent \
              > /tmp/ocr-result.json 2>/tmp/ocr-stderr.log; then
              echo "OCR review succeeded"
              exit_code=0
              break
            fi
            exit_code=$?
            echo "OCR review failed (exit=$exit_code); stderr tail:"
            tail -20 /tmp/ocr-stderr.log
            sleep $((attempt * 15))
          done
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          echo "=== OCR result ==="
          cat /tmp/ocr-result.json 2>/dev/null || echo "(no result file)"
          echo "=== OCR stderr ==="
          cat /tmp/ocr-stderr.log 2>/dev/null || echo "(no stderr file)"

      - name: Post review comments to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          REVIEW_EXIT_CODE: ${{ steps.review.outputs.exit_code }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const resultPath = '/tmp/ocr-result.json';
            const stderrPath = '/tmp/ocr-stderr.log';
            const exitCode = Number(process.env.REVIEW_EXIT_CODE || '0');

            if (exitCode !== 0) {
              const stderr = fs.existsSync(stderrPath) ? fs.readFileSync(stderrPath, 'utf8').trim() : '';
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `⚠️ **OpenCodeReview** could not complete after retries (exit code ${exitCode}).\n\nThis is a transient LLM/API failure, not a code finding. Re-run the workflow or push to retry.\n\n\`\`\`\n${(stderr || 'no stderr captured').slice(0, 8000)}\n\`\`\``,
              });
              return;
            }

            let result;
            try {
              result = JSON.parse(fs.readFileSync(resultPath, 'utf8'));
            } catch (e) {
              const stderr = fs.existsSync(stderrPath) ? fs.readFileSync(stderrPath, 'utf8').trim() : '';
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `⚠️ **OpenCodeReview** encountered an error:\n\`\`\`\n${(stderr || e.message).slice(0, 8000)}\n\`\`\``,
              });
              return;
            }

            const comments = result.comments || [];
            const warnings = result.warnings || [];

            if (comments.length === 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `✅ **OpenCodeReview**: ${result.message || 'No comments generated. Looks good to me.'}`,
              });
              return;
            }

            const prNumber = context.issue.number;
            const commitSha = context.payload.pull_request.head.sha;

            const reviewComments = [];
            const commentsWithoutLine = [];

            for (const comment of comments) {
              let body = comment.content || '';
              if (comment.suggestion_code && comment.existing_code) {
                body += '\n\n**Suggestion:**\n```suggestion\n' + comment.suggestion_code + (comment.suggestion_code.endsWith('\n') ? '' : '\n') + '```';
              }

              const hasValidLine = (comment.start_line >= 1) || (comment.end_line >= 1);
              if (!hasValidLine) {
                commentsWithoutLine.push({ comment });
                continue;
              }

              const rc = { path: comment.path, body, side: 'RIGHT' };
              if (comment.start_line >= 1 && comment.end_line >= 1 && comment.start_line !== comment.end_line) {
                rc.start_line = comment.start_line;
                rc.line = comment.end_line;
                rc.start_side = 'RIGHT';
              } else if (comment.end_line >= 1) {
                rc.line = comment.end_line;
              } else {
                rc.line = comment.start_line;
              }
              reviewComments.push(rc);
            }

            let summaryBody = `🔍 **OpenCodeReview** found **${comments.length}** issue(s) in this PR.`;
            summaryBody += `\n- ${reviewComments.length} posted as inline comment(s)`;
            summaryBody += `\n- ${commentsWithoutLine.length} included in this summary`;
            if (warnings.length > 0) {
              summaryBody += `\n\n⚠️ ${warnings.length} warning(s) occurred during review.`;
            }

            for (const { comment } of commentsWithoutLine) {
              summaryBody += '\n\n---\n\n### 📄 `' + comment.path + '`';
              if (comment.start_line && comment.end_line) summaryBody += ` (L${comment.start_line}-L${comment.end_line})`;
              summaryBody += '\n\n' + (comment.content || '');
              if (comment.suggestion_code && comment.existing_code) {
                summaryBody += '\n\n💡 **Suggested Change**\n\n**Before:**\n```\n' + comment.existing_code + '\n```\n\n**After:**\n```\n' + comment.suggestion_code + '\n```';
              }
            }

            try {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                commit_id: commitSha,
                body: summaryBody,
                event: 'COMMENT',
                comments: reviewComments,
              });
            } catch (e) {
              let ok = 0;
              const failed = [];
              for (const rc of reviewComments) {
                try {
                  await github.rest.pulls.createReview({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: prNumber,
                    commit_id: commitSha,
                    body: '',
                    event: 'COMMENT',
                    comments: [rc],
                  });
                  ok++;
                } catch (inner) {
                  failed.push(`\`${rc.path}\`: ${inner.message}`);
                }
              }
              let body = summaryBody + `\n\n---\n📊 Posted ${ok}/${reviewComments.length} inline comment(s).`;
              if (failed.length) body += '\n\nFailed:\n' + failed.join('\n');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  graph-knowledge:
    name: Knowledge Graph
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout (full history for base-ref diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (all packages)
        run: pnpm run build

      - name: Resolve base ref
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "BASE_REF=origin/${{ github.event.pull_request.base.ref }}" >> "$GITHUB_ENV"
          else
            echo "BASE_REF=origin/main" >> "$GITHUB_ENV"
          fi

      - name: Initialize the knowledge graph (full ingestion of HEAD)
        # Freshness gate (issue #138): `init` stamps META_KEY_LAST_INGESTED_SOURCE_SHA to HEAD only
        # after a successful full ingestion, so a graph that cannot ingest HEAD fails the job
        # deterministically. `--platform=` skips the per-platform hook installers (not relevant to
        # the graph, and they'd add CI fragility) while still building the DB + graph. Non-interactive
        # by default (IFCE-004).
        run: npx --no-install docuvia init --platform=

      - name: Ingest the diff (AST-only, no LSP gate, no Tier C dependency)
        # Freshness gate #2: the PR/push delta path. `--fallback-ast` skips the LSP-readiness gate so
        # CI never hangs on a missing LSP server; a failed delta ingest (graph left stale vs HEAD)
        # also fails the job.
        run: npx --no-install docuvia analyze --fallback-ast

      - name: Doctor report (non-blocking -- graph health, LLM/LSP skipped)
        # post_commit_ingestion asserts HEAD vs the ingested sha. --skip-llm/--skip-lsp keep transient
        # Tier C bridge failures and missing LSP servers from reddening the job -- the deterministic
        # freshness hard-fail lives in the init/analyze steps above. Exit captured, not fatal.
        id: doctor
        run: |
          npx --no-install docuvia doctor --skip-llm --skip-lsp \
            > /tmp/doctor-report.log 2>&1 \
            || echo "doctor_exit=$?" >> "$GITHUB_OUTPUT"

      - name: Review blast radius against base
        # Non-blocking like the OCR review job (transient graph/git failures must not red the PR),
        # but the JSON result is what the comment below surfaces.
        id: review
        run: |
          npx --no-install docuvia review "$BASE_REF" --format=json \
            > /tmp/graph-review.json 2>/tmp/graph-review.err \
            || echo "review_exit=$?" >> "$GITHUB_OUTPUT"

      - name: Post knowledge-graph review to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          DOCTOR_EXIT: ${{ steps.doctor.outputs.doctor_exit }}
          REVIEW_EXIT: ${{ steps.review.outputs.review_exit }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const reviewPath = '/tmp/graph-review.json';
            const reviewErrPath = '/tmp/graph-review.err';
            const reviewExit = process.env.REVIEW_EXIT || '0';
            const doctorExit = process.env.DOCTOR_EXIT || '0';

            if (!fs.existsSync(reviewPath)) {
              const err = fs.existsSync(reviewErrPath)
                ? fs.readFileSync(reviewErrPath, 'utf8').trim()
                : '';
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `⚠️ **Knowledge Graph** review could not complete (exit ${reviewExit}).\n\nThe graph itself was built and ingested by the earlier steps, so this is not a staleness failure.\n\n\`\`\`\n${(err || 'no stderr captured').slice(0, 4000)}\n\`\`\``,
              });
              return;
            }

            const result = JSON.parse(fs.readFileSync(reviewPath, 'utf8'));
            const files = (result.filesChanged || [])
              .map((f) => `- \`${f.file}\` (${f.status})`)
              .join('\n') || '- (none)';
            const impacted = (result.affectedNodes || [])
              .flatMap((n) => (n.impactedBy || []).filter((e) => e && e.name).map((e) => `- \`${n.file}\` <- \`${e.name}\``))
              .slice(0, 20)
              .join('\n');
            const analysis = (result.analysis || '').slice(0, 6000);
            const doctorNote = doctorExit !== '0'
              ? '\n\n> `doctor` reported a non-blocking graph-health finding (see the workflow log).'
              : '';

            const body =
              `🗺️ **Knowledge Graph** review against \`${result.baseRef || 'base'}\`:\n` +
              `- Risk level: **${result.riskLevel || 'unknown'}**\n` +
              `- Files changed: ${(result.filesChanged || []).length}\n` +
              `- Graph ingested at HEAD — the freshness gate passed (\`init\` + \`analyze --fallback-ast\` both exited 0).${doctorNote}\n\n` +
              `### Changed files\n${files}\n\n` +
              (impacted ? `### Impacted by\n${impacted}\n\n` : '') +
              `### Analysis\n${analysis}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
