name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────
  # Job 1: Format check (fast feedback — runs in parallel with typecheck-and-build)
  # ──────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run lint

  # ──────────────────────────────────────────────────────────
  # Job 2: TypeScript type-check + compile all packages
  # ──────────────────────────────────────────────────────────
  typecheck-and-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API codegen
        run: pnpm --filter @workspace/api-spec run codegen

      - name: Type check (all packages)
        run: pnpm run typecheck

      - name: Build all packages
        run: pnpm -r --if-present run build
        env:
          # Vite needs NODE_ENV for production builds
          NODE_ENV: production

      - name: Package VS Code extension (.vsix)
        run: pnpm --filter docuvia-vscode run package

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: docuvia-vscode
          path: artifacts/vscode-client/*.vsix

  test:
    name: Vitest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: docuvia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d docuvia_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/docuvia_test
      PORT: "8080"
      AI_INTEGRATIONS_OPENAI_API_KEY: test-key
      AI_INTEGRATIONS_OPENAI_BASE_URL: http://127.0.0.1:65535/v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API codegen
        run: pnpm --filter @workspace/api-spec run codegen

      - name: Push test database schema
        run: pnpm --filter @workspace/db run push

      - name: Run tests with coverage
        run: pnpm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
