# Impact honesty eval (issue #508 Phase 4) — sliced report and hard regression gates.
# The six-test corpus is opt-in here; the default suite keeps the Phase 4 unit tests without
# replaying the expensive legacy and Phase 1–3 subprocess corpora.
#
# The evaluator runs the real structured `docuvia impact --format=json` path across the legacy
# #192 slice and Phase 1–3 honesty corpora. It fails independently on case errors/drops,
# false-safe results, provenance mismatches, false positives, wrong targets, replay mismatches,
# legacy regressions, Phase 1–3 gate failures, and invalid known-defect registry entries. The
# report never emits a blended accuracy score.
name: Eval

on:
  workflow_dispatch:
  schedule:
    # Weekly drift signal -- Mondays 06:23 UTC (same slot as CRG's eval.yml).
    - cron: "23 6 * * 1"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  impact-accuracy:
    name: Impact accuracy (gated)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (all packages)
        run: pnpm run build

      - name: Run gated impact-accuracy eval over the regression corpus
        run: pnpm run eval:impact

      - name: Run full sliced impact-honesty report and hard gates
        run: pnpm run eval:impact:honesty

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: impact-accuracy-results
          path: |
            evaluate/results/*.csv
            evaluate/results/*.summary.md
            evaluate/results/impact_honesty_phase4.json
          if-no-files-found: warn
          retention-days: 90

      - name: Write sliced report to job summary
        if: always()
        run: |
          if [ -f evaluate/results/impact_honesty_phase4.summary.md ]; then
            cat evaluate/results/impact_honesty_phase4.summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No Phase 4 honesty summary was produced; the gated eval step contains the failure." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Posting is informational; the preceding eval step is the blocking correctness gate.
      # A fresh comment is used rather than --edit-last because other jobs also comment as
      # github-actions[bot], and editing "the last one" could clobber an unrelated review.
      - name: Post summary to PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          summary="evaluate/results/impact_honesty_phase4.summary.md"
          if [ ! -f "$summary" ]; then
            summary="$(ls -1 evaluate/results/*.summary.md 2>/dev/null | tail -n 1 || true)"
          fi
          if [ -z "$summary" ]; then
            echo "No impact summary was produced; the gated eval step contains the failure."
            exit 0
          fi
          echo "Posting $summary to PR #$PR_NUMBER"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$summary"
