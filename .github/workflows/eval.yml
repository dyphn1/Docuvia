# Impact-accuracy eval (issue #192) — Phase 6 regression gate.
#
# The evaluator runs the real structured `docuvia impact --format=json` path against the
# human-labeled corpus in `artifacts/cli/test/support/impact-corpus.ts`, writes precision/recall/F1
# evidence, and fails when the corrected product-path baseline regresses or any case errors.
name: Eval

on:
  workflow_dispatch:
  schedule:
    # Weekly drift signal -- Mondays 06:23 UTC (same slot as CRG's eval.yml).
    - cron: "23 6 * * 1"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  impact-accuracy:
    name: Impact accuracy (gated)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (all packages)
        run: pnpm run build

      - name: Run gated impact-accuracy eval over the regression corpus
        run: pnpm run eval:impact

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: impact-accuracy-results
          path: |
            evaluate/results/*.csv
            evaluate/results/*.summary.md
          if-no-files-found: warn
          retention-days: 90

      # Posting is informational; the preceding eval step is the blocking correctness gate.
      # A fresh comment is used rather than --edit-last because other jobs also comment as
      # github-actions[bot], and editing "the last one" could clobber an unrelated review.
      - name: Post summary to PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          summary="$(ls -1 evaluate/results/*.summary.md 2>/dev/null | tail -n 1 || true)"
          if [ -z "$summary" ]; then
            echo "No impact summary was produced; the gated eval step contains the failure."
            exit 0
          fi
          echo "Posting $summary to PR #$PR_NUMBER"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$summary"
