name: Format Preview TDD

on:
  push:
    branches:
      - test/tdd-quality-ast-processing

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed TDD files
        run: >-
          pnpm exec prettier --write
          lib/core/src/ast/ast-processing.service.contract.unit.test.ts
          test/ast-processing-tdd-quality.test.ts
          test/tdd-quality-score.test.ts

      - name: Print formatting diff
        run: git diff --no-ext-diff --unified=200 -- lib/core/src/ast/ast-processing.service.contract.unit.test.ts test/ast-processing-tdd-quality.test.ts test/tdd-quality-score.test.ts
