name: Phase 5 Prettier Write

on:
  push:
    branches:
      - test/phase5-query-retrieval-hardening

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, 'chore: format Phase 5 evidence') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/phase5-query-retrieval-hardening
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format Phase 5 evidence
        run: >-
          pnpm exec prettier --write
          lib/core/src/query/phase5-query-quality.integration.test.ts
          lib/schema/src/sqlite/phase5-fts-quality.integration.test.ts
          test/phase5-query-retrieval-tdd-quality.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/core/src/query/phase5-query-quality.integration.test.ts \
            lib/schema/src/sqlite/phase5-fts-quality.integration.test.ts \
            test/phase5-query-retrieval-tdd-quality.test.ts
          git commit -m "chore: format Phase 5 evidence"
          git push origin HEAD:test/phase5-query-retrieval-hardening
