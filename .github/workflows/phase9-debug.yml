name: Phase9 PR429 Debug

on:
  push:
    branches:
      - debug/phase9-429

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Update Phase 9 evidence and format exact output
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('test/phase9-cli-tdd-quality.test.ts')
          text = p.read_text()
          old = 'is idempotent: running analyze twice never duplicates the project row'
          new = 'keeps identical re-analysis deterministic without duplicating the project row'
          if old not in text:
              raise SystemExit(f'missing expected evidence: {old}')
          p.write_text(text.replace(old, new))
          PY
          pnpm exec prettier --write \
            artifacts/cli/test/integration/commands/analyze-config-scan.integration.test.ts \
            test/phase9-cli-tdd-quality.test.ts
      - name: Build workspace dependencies
        run: pnpm run build
      - name: Run targeted regression tests
        run: pnpm exec vitest run test/phase9-cli-tdd-quality.test.ts artifacts/cli/test/integration/commands/analyze-config-scan.integration.test.ts --testTimeout=120000 --hookTimeout=120000
      - name: Persist verified exact files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/cli/test/integration/commands/analyze-config-scan.integration.test.ts test/phase9-cli-tdd-quality.test.ts
          if git diff --cached --quiet; then
            echo "No changes to persist"
            exit 0
          fi
          git commit -m "chore(debug): persist verified phase9 evidence" --no-verify
          git push --no-verify
