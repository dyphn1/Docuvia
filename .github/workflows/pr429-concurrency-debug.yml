name: PR429 Concurrency Debug

on:
  push:
    branches:
      - debug/pr429-concurrency

permissions:
  contents: write

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Format and verify concurrency diagnostic
        shell: bash
        run: |
          pnpm exec prettier --write artifacts/cli/test/integration/commands/analyze-concurrency.test.ts
          pnpm exec vitest run artifacts/cli/test/integration/commands/analyze-concurrency.test.ts --testTimeout=120000 --hookTimeout=120000
      - name: Persist exact formatted diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/cli/test/integration/commands/analyze-concurrency.test.ts
          if git diff --cached --quiet; then
            echo "No changes to persist"
            exit 0
          fi
          git commit -m "chore(debug): persist formatted concurrency diagnostic" --no-verify
          git push --no-verify
