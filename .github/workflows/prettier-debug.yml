name: Prettier Debug

on:
  push:
    branches:
      - debug/prettier-429

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Show exact Prettier diff
        run: |
          pnpm exec prettier --write artifacts/cli/test/integration/commands/analyze-config-scan.integration.test.ts
          git diff -- artifacts/cli/test/integration/commands/analyze-config-scan.integration.test.ts
