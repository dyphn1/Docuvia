name: Prettier Debug

on:
  push:
    branches:
      - debug/prettier-429

permissions:
  contents: write

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact Prettier output
        run: |
          pnpm exec prettier --write artifacts/cli/test/integration/commands/analyze-config-scan.integration.test.ts
          if git diff --quiet -- artifacts/cli/test/integration/commands/analyze-config-scan.integration.test.ts; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/cli/test/integration/commands/analyze-config-scan.integration.test.ts
          git commit -m "chore(debug): apply prettier output"
          git push
