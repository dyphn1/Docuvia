name: Release

# semantic-release derives the next version from conventional commits on main, then:
# tags the release, creates the GitHub Release, commits CHANGELOG.md + the bumped
# artifacts/cli/package.json back to main ([skip ci] prevents a CI/release loop), and
# publishes `docuvia` to npm under the `beta` dist-tag (see publishConfig in
# artifacts/cli/package.json — flip to "latest" when the package graduates).

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**.md"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release (semantic-release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # semantic-release needs full history to analyze commits since the last release.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org/"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (all packages)
        run: pnpm run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # setup-node's registry-url generates a temp .npmrc (via NPM_CONFIG_USERCONFIG)
          # that references ${NODE_AUTH_TOKEN}; without this the spawned npm resolves an
          # empty token and fails with 401 even though NPM_TOKEN is set.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm exec semantic-release
