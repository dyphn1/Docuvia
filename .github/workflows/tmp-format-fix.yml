name: Temporary format fix

on:
  push:
    branches:
      - fix/issues-343-356

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issues-343-356
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed files
        run: pnpm exec prettier --write lib/ui-core/src/workflows/sync/sync-workflow.unit.test.ts pnpm-lock.yaml
      - name: Commit formatting
        run: |
          if git diff --quiet -- lib/ui-core/src/workflows/sync/sync-workflow.unit.test.ts pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/ui-core/src/workflows/sync/sync-workflow.unit.test.ts pnpm-lock.yaml
          git commit -m "style: format issue fixes"
          git push origin HEAD:fix/issues-343-356
