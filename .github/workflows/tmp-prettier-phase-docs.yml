name: tmp-prettier-phase-docs

on:
  push:
    branches:
      - docs/phase-based-test-quality-governance

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/gitbook/adr/platform/PLAT-010-phase-based-test-quality-governance.md docs/gitbook/adr/platform/README.md docs/gitbook/guidelines/phase-based-test-quality-hardening.md
      - run: git diff -- docs/gitbook/adr/platform/PLAT-010-phase-based-test-quality-governance.md docs/gitbook/adr/platform/README.md docs/gitbook/guidelines/phase-based-test-quality-hardening.md > prettier-phase-docs.patch
      - uses: actions/upload-artifact@v4
        with:
          name: prettier-phase-docs-patch
          path: prettier-phase-docs.patch
