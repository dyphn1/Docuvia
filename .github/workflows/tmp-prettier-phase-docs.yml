name: tmp-prettier-phase-docs

on:
  push:
    branches:
      - docs/phase-based-test-quality-governance

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/phase-based-test-quality-governance
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format phase governance docs
        run: pnpm exec prettier --write docs/gitbook/adr/platform/PLAT-010-phase-based-test-quality-governance.md docs/gitbook/adr/platform/README.md docs/gitbook/guidelines/phase-based-test-quality-hardening.md
      - name: Commit formatted docs
        shell: bash
        env:
          HUSKY: "0"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/gitbook/adr/platform/PLAT-010-phase-based-test-quality-governance.md docs/gitbook/adr/platform/README.md docs/gitbook/guidelines/phase-based-test-quality-hardening.md
          if git diff --cached --quiet; then
            echo "No formatting changes to commit"
            exit 0
          fi
          git commit --no-verify -m "docs: format phase test quality governance"
          git push --no-verify origin HEAD:docs/phase-based-test-quality-governance
