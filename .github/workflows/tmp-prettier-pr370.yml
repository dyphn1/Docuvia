name: tmp-prettier-pr370

on:
  push:
    branches:
      - test/tdd-quality-ast-processing

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/tdd-quality-ast-processing
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format failing file
        run: pnpm exec prettier --write test/tdd-quality-score.test.ts
      - name: Print formatted file
        shell: bash
        run: |
          echo '---PRETTIER-FILE-BEGIN---'
          cat test/tdd-quality-score.test.ts
          echo '---PRETTIER-FILE-END---'
