name: TMP Prettier PR377

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Phase 1 files
        run: >-
          pnpm exec prettier --write
          lib/contracts/src/logging/ipc-log-message.unit.test.ts
          test/phase1-contracts-schema-tdd-quality.test.ts

      - name: Print exact Prettier diff
        run: >-
          git diff --
          lib/contracts/src/logging/ipc-log-message.unit.test.ts
          test/phase1-contracts-schema-tdd-quality.test.ts
