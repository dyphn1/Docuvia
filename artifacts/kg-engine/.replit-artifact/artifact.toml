kind = "web"
previewPath = "/"
title = "Knowledge Graph Engine"
version = "1.0.0"
id = "artifacts/kg-engine"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18774

[services.development]
run = "pnpm --filter @workspace/kg-engine run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kg-engine", "run", "build" ]
publicDir = "artifacts/kg-engine/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18774"
BASE_PATH = "/"
