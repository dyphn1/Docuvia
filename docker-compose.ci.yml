version: "3.8"

services:
  # Mock GitHub Actions PostgreSQL service
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docuvia_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docuvia_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mock GitHub Actions Ubuntu Runner environment
  ci-runner:
    image: node:24-bookworm # Mocks ubuntu-latest + actions/setup-node@v4
    environment:
      CI: "true"
      # DATABASE_URL uses the service name 'postgres' instead of localhost
      # because it requires the service name within the docker-compose internal network.
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/docuvia_test
      PORT: "8080"
      AI_INTEGRATIONS_OPENAI_API_KEY: test-key
      AI_INTEGRATIONS_OPENAI_BASE_URL: http://127.0.0.1:65535/v1
    volumes:
      - .:/host_workspace
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -c "
      echo '🚀 Preparing isolated workspace...' &&
      mkdir -p /workspace &&
      tar -cf - -C /host_workspace --exclude=node_modules --exclude=.git . | tar -xf - -C /workspace &&
      echo '🚀 Starting CI environment simulation...' &&
      corepack enable pnpm &&
      echo '📦 Installing dependencies...' &&
      pnpm config set confirmModulesPurge false &&
      pnpm install --frozen-lockfile &&
      echo '🔍 Running Lint...' &&
      pnpm run format &&
      pnpm run lint &&
      echo '⚙️ Running API Codegen...' &&
      pnpm --filter @workspace/api-spec run codegen &&
      echo '🛡️ Running Typecheck...' &&
      pnpm run typecheck &&
      echo '🔨 Running Build...' &&
      NODE_ENV=production pnpm -r --if-present run build &&
      echo '🗄️ Pushing Database Schema...' &&
      pnpm --filter @workspace/db run push &&
      echo '🧪 Running Tests...' &&
      pnpm run test:coverage &&
      echo '✅ CI workflow simulation completed!'
      "
