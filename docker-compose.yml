version: "3.8"
services:
  db:
    image: pgvector/pgvector:pg15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docuvia_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docuvia_test"]
      interval: 2s
      timeout: 5s
      retries: 5
