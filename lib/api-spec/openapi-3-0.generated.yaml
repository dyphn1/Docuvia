openapi: 3.0.3
info:
  title: Api
  version: 0.2.0
  description: Docuvia — Universal VCS Knowledge Graph Engine API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: Project (repo) management
  - name: l1-tags
    description: Global L1 tag pool management
  - name: l2-nodes
    description: L2 Package/Module/PCD nodes
  - name: l3-nodes
    description: L3 change/decision nodes
  - name: commits
    description: VCS commit management
  - name: review-tasks
    description: Human review and correction tasks
  - name: dashboard
    description: Dashboard and analytics
  - name: ingest
    description: Data ingestion (Git, documents)
  - name: generate
    description: AI knowledge generation pipeline
  - name: search
    description: Knowledge search and query
  - name: mcp
    description: MCP tool endpoints for agent use
  - name: documents
    description: Document management
  - name: llm-config
    description: LLM configuration per project
  - name: subscriptions
    description: Cross-team project subscriptions
  - name: notifications
    description: In-app notifications
  - name: github-prs
    description: GitHub Pull Request integration
  - name: extensions
    description: VS Code extension endpoints
  - name: integrations
    description: Per-project Slack / Teams webhook integrations
  - name: sync
    description: Sync pipeline — branch push synchronization

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get project by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /projects/{id}/graph:
    get:
      operationId: getProjectGraph
      tags: [projects]
      summary: Get full L1/L2/L3 graph for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project graph data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectGraph"

  /projects/{id}/commits:
    get:
      operationId: listCommits
      tags: [commits]
      summary: List commits for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of commits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Commit"
    post:
      operationId: createCommit
      tags: [commits]
      summary: Add a commit to a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitInput"
      responses:
        "201":
          description: Created commit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Commit"

  /projects/{id}/l2-nodes:
    get:
      operationId: listProjectL2Nodes
      tags: [l2-nodes]
      summary: List L2 nodes for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of L2 nodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/L2Node"

  /projects/{id}/ingest/git:
    post:
      operationId: ingestGit
      tags: [ingest]
      summary: Ingest commits from a Git repository (GitHub API)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitIngestInput"
      responses:
        "200":
          description: Ingest result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitIngestResult"

  /projects/{id}/ingest/status:
    get:
      operationId: getProjectIngestStatus
      tags: [ingest]
      summary: Get ingest status and cursor info for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ingest status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestStatusResponse"

  /projects/{id}/ingest/svn:
    post:
      operationId: ingestSvn
      tags: [ingest]
      summary: Ingest SVN commits into the knowledge graph
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SvnIngestInput"
      responses:
        "200":
          description: Ingest result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SvnIngestResult"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{id}/ingest/document:
    post:
      operationId: ingestDocument
      tags: [ingest]
      summary: Ingest a document (MD, TXT) into the project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentIngestInput"
      responses:
        "201":
          description: Stored document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /projects/{id}/ingest/document/upload:
    post:
      operationId: uploadDocument
      tags: [ingest]
      summary: Upload and parse a document file (PDF, DOCX, PPTX, MD)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/DocumentUploadInput"
      responses:
        "200":
          description: Uploaded and parsed document record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          description: Unsupported file type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: File too large (exceeds 10MB limit)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{id}/documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List documents for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"

  /projects/{id}/generate:
    post:
      operationId: generateKnowledge
      tags: [generate]
      summary: Run the AI knowledge construction pipeline (L1 → L2 → L3)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateInput"
      responses:
        "200":
          description: Generation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateResult"

  /projects/{id}/export:
    get:
      operationId: exportProject
      tags: [projects]
      summary: Export project knowledge base as JSON
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Exported knowledge base
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectExport"

  /projects/{id}/templates:
    get:
      operationId: listProjectTemplates
      tags: [llm-config]
      summary: List prompt templates for a project (with defaults)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PromptTemplate"

  /projects/{id}/templates/{type}:
    put:
      operationId: upsertProjectTemplate
      tags: [llm-config]
      summary: Create or update a prompt template for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [l1_tagger, l2_extractor, l3_generator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptTemplateInput"
      responses:
        "200":
          description: Upserted template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptTemplate"
        "201":
          description: Created template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptTemplate"
    delete:
      operationId: deleteProjectTemplate
      tags: [llm-config]
      summary: Reset a prompt template to global default
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [l1_tagger, l2_extractor, l3_generator]
      responses:
        "204":
          description: Deleted (reset to default)

  /projects/{id}/llm-config:
    get:
      operationId: getLlmConfig
      tags: [llm-config]
      summary: Get LLM configuration for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: LLM config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmConfig"
    patch:
      operationId: updateLlmConfig
      tags: [llm-config]
      summary: Update LLM configuration for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LlmConfigInput"
      responses:
        "200":
          description: Updated LLM config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmConfig"

  /l1-tags:
    get:
      operationId: listL1Tags
      tags: [l1-tags]
      summary: List all global L1 tags
      responses:
        "200":
          description: List of L1 tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/L1Tag"
    post:
      operationId: createL1Tag
      tags: [l1-tags]
      summary: Create a new L1 tag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L1TagInput"
      responses:
        "201":
          description: Created L1 tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/L1Tag"

  /l1-tags/{id}:
    patch:
      operationId: updateL1Tag
      tags: [l1-tags]
      summary: Update an L1 tag
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L1TagUpdate"
      responses:
        "200":
          description: Updated L1 tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/L1Tag"
    delete:
      operationId: deleteL1Tag
      tags: [l1-tags]
      summary: Delete an L1 tag
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /l2-nodes:
    post:
      operationId: createL2Node
      tags: [l2-nodes]
      summary: Create a new L2 node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L2NodeInput"
      responses:
        "201":
          description: Created L2 node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/L2Node"

  /l2-nodes/{id}:
    patch:
      operationId: updateL2Node
      tags: [l2-nodes]
      summary: Update an L2 node
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L2NodeUpdate"
      responses:
        "200":
          description: Updated L2 node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/L2Node"
    delete:
      operationId: deleteL2Node
      tags: [l2-nodes]
      summary: Delete an L2 node
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /l2-nodes/{id}/links:
    get:
      operationId: listNodeLinks
      tags: [l2-nodes]
      summary: Get dependency links for an L2 node
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of node links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NodeLink"
    post:
      operationId: createNodeLink
      tags: [l2-nodes]
      summary: Create a dependency link between L2 nodes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeLinkInput"
      responses:
        "201":
          description: Created link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeLink"

  /l2-nodes/{id}/l3-nodes:
    get:
      operationId: listL3Nodes
      tags: [l3-nodes]
      summary: List L3 nodes under an L2 node
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of L3 nodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/L3Node"
    post:
      operationId: createL3Node
      tags: [l3-nodes]
      summary: Create a new L3 node
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L3NodeInput"
      responses:
        "201":
          description: Created L3 node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/L3Node"

  /l3-nodes/{id}:
    patch:
      operationId: updateL3Node
      tags: [l3-nodes]
      summary: Update an L3 node
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L3NodeUpdate"
      responses:
        "200":
          description: Updated L3 node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/L3Node"
    delete:
      operationId: deleteL3Node
      tags: [l3-nodes]
      summary: Delete an L3 node
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /review-tasks:
    get:
      operationId: listReviewTasks
      tags: [review-tasks]
      summary: List review tasks (pending human review)
      responses:
        "200":
          description: List of review tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewTask"

  /review-tasks/stats:
    get:
      operationId: getReviewStats
      tags: [review-tasks]
      summary: Get review task statistics
      responses:
        "200":
          description: Review task stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewStats"

  /review-tasks/{id}:
    patch:
      operationId: resolveReviewTask
      tags: [review-tasks]
      summary: Resolve a review task (approve or reject)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewResolution"
      responses:
        "200":
          description: Resolved task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewTask"

  /search:
    post:
      operationId: searchKnowledge
      tags: [search]
      summary: Full-text search across L1/L2/L3 nodes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchInput"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"

  /mcp/list_projects:
    get:
      operationId: mcpListProjects
      tags: [mcp]
      summary: "MCP: List all projects"
      responses:
        "200":
          description: MCP project list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpProjectList"

  /mcp/search_knowledge:
    get:
      operationId: mcpSearchKnowledge
      tags: [mcp]
      summary: "MCP: Semantic search across knowledge graph"
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: project_id
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: MCP search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpSearchResult"

  /mcp/get_dependencies:
    get:
      operationId: mcpGetDependencies
      tags: [mcp]
      summary: "MCP: Get module dependency graph"
      parameters:
        - name: module
          in: query
          required: true
          schema:
            type: string
        - name: project_id
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Dependency list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpDependencyResult"

  /mcp/impact_analysis:
    get:
      operationId: mcpImpactAnalysis
      tags: [mcp]
      summary: "MCP: Impact analysis — what breaks if module changes"
      parameters:
        - name: module
          in: query
          required: true
          schema:
            type: string
        - name: project_id
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Impact analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpImpactResult"

  /mcp/get_decision_record:
    get:
      operationId: mcpGetDecisionRecord
      tags: [mcp]
      summary: "MCP: Fetch L3 decision record by commit hash"
      parameters:
        - name: commit_hash
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Decision record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpDecisionRecord"

  /mcp/query:
    post:
      operationId: mcpQuery
      tags: [mcp]
      summary: "MCP: Agentic RAG query with intent routing"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpQueryInput"
      responses:
        "200":
          description: Agentic query result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpQueryResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /subscriptions:
    post:
      operationId: createSubscription
      tags: [subscriptions]
      summary: Create a cross-team subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionInput"
      responses:
        "201":
          description: Created subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /subscriptions/{subscriptionId}:
    delete:
      operationId: deleteSubscription
      tags: [subscriptions]
      summary: Remove a subscription
      parameters:
        - name: subscriptionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/subscriptions:
    get:
      operationId: listProjectSubscriptions
      tags: [subscriptions]
      summary: List subscriptions for a project (as subscriber and publisher)
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of subscriptions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionListResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{projectId}/notifications:
    get:
      operationId: listProjectNotifications
      tags: [notifications]
      summary: List notifications for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: unreadOnly
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /notifications/{notificationId}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a single notification as read
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /notifications/mark-all-read:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read for a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkAllReadInput"
      responses:
        "200":
          description: Number of notifications marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkAllReadResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{id}/pull-requests:
    get:
      operationId: listPullRequests
      tags: [github-prs]
      summary: List pull requests for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of pull requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PullRequest"

  /projects/{id}/pull-requests/{prNumber}:
    get:
      operationId: getPullRequestDetail
      tags: [github-prs]
      summary: Get PR details with knowledge graph impact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: prNumber
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: PR with impact analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullRequestDetail"
        "404":
          description: Not found

  /projects/{id}/pull-requests/{prNumber}/analyze:
    post:
      operationId: analyzePullRequest
      tags: [github-prs]
      summary: Manually trigger PR knowledge impact analysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: prNumber
          in: path
          required: true
          schema:
            type: integer
      responses:
        "202":
          description: Analysis triggered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrAnalyzeResult"
        "404":
          description: PR not found

  /webhooks/github/{projectId}:
    post:
      operationId: githubWebhook
      tags: [github-prs]
      summary: GitHub webhook receiver for PR events
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: GitHub webhook payload (varies by event type)
      responses:
        "202":
          description: Webhook accepted
        "400":
          description: Invalid signature or bad payload
        "404":
          description: Project not found

  /extensions/vscode/query:
    post:
      operationId: vscodeQuery
      tags: [extensions]
      summary: "VSCode extension: RAG query"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VscodeQueryInput"
      responses:
        "200":
          description: Query results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VscodeQueryResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /extensions/vscode/create-decision:
    post:
      operationId: vscodeCreateDecision
      tags: [extensions]
      summary: "VSCode extension: Create L3 decision"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VscodeCreateDecisionInput"
      responses:
        "201":
          description: Created L3 node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/L3Node"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /extensions/vscode/file-context:
    get:
      operationId: vscodeFileContext
      tags: [extensions]
      summary: "VSCode extension: Get file-related context (L2/L3 nodes)"
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
        - name: projectId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: File context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileContextResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{id}/integrations:
    get:
      operationId: listProjectIntegrations
      tags: [integrations]
      summary: List Slack/Teams integrations for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of integrations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectIntegration"
    post:
      operationId: createProjectIntegration
      tags: [integrations]
      summary: Add a Slack or Teams webhook integration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectIntegrationInput"
      responses:
        "201":
          description: Created integration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectIntegration"

  /integrations/{integrationId}:
    patch:
      operationId: updateProjectIntegration
      tags: [integrations]
      summary: Update a webhook integration
      parameters:
        - name: integrationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectIntegrationUpdate"
      responses:
        "200":
          description: Updated integration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectIntegration"
        "404":
          description: Not found
    delete:
      operationId: deleteProjectIntegration
      tags: [integrations]
      summary: Remove a webhook integration
      parameters:
        - name: integrationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /integrations/{integrationId}/test:
    post:
      operationId: testProjectIntegration
      tags: [integrations]
      summary: Send a test notification to the configured webhook
      parameters:
        - name: integrationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Test sent
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
        "404":
          description: Not found

  /sync:
    post:
      operationId: syncPipeline
      tags: [sync]
      summary: Trigger the sync pipeline for a project branch push
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncInput"
      responses:
        "200":
          description: Sync scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /documents/misc:
    get:
      operationId: listMiscDocuments
      tags: [documents]
      summary: List all unaffiliated documents (projectId is null / status is unaffiliated)
      responses:
        "200":
          description: List of unaffiliated documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"

  /documents/{id}/affiliate:
    post:
      operationId: affiliateDocument
      tags: [documents]
      summary: Associate an unaffiliated document with a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AffiliateDocumentInput"
      responses:
        "200":
          description: Updated document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "404":
          description: Document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    DashboardStats:
      type: object
      required:
        [totalProjects, totalL1Tags, totalL2Nodes, totalL3Nodes, pendingReviews, recentActivity]
      properties:
        totalProjects:
          type: integer
        totalL1Tags:
          type: integer
        totalL2Nodes:
          type: integer
        totalL3Nodes:
          type: integer
        pendingReviews:
          type: integer
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"

    ActivityItem:
      type: object
      required: [id, type, description, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [commit, l2_created, l3_created, review_resolved, tag_added]
        description:
          type: string
        projectName:
          type: ["string", "null"]
        createdAt:
          type: string

    Project:
      type: object
      required: [id, name, repoUrl, status, l2Count, l3Count, commitCount, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        repoUrl:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, indexing, paused, error]
        l2Count:
          type: integer
        l3Count:
          type: integer
        commitCount:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string
        vcsType:
          type: string
          enum: [git, svn]
          default: git
        svnUrl:
          type: ["string", "null"]

    ProjectInput:
      type: object
      required: [name, repoUrl]
      properties:
        name:
          type: string
          minLength: 1
        repoUrl:
          type: string
          minLength: 1
        description:
          type: string

    ProjectUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        repoUrl:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [active, indexing, paused, error]

    ProjectGraph:
      type: object
      required: [projectId, l1Tags, l2Nodes, l3Nodes]
      properties:
        projectId:
          type: integer
        l1Tags:
          type: array
          items:
            $ref: "#/components/schemas/L1Tag"
        l2Nodes:
          type: array
          items:
            $ref: "#/components/schemas/L2Node"
        l3Nodes:
          type: array
          items:
            $ref: "#/components/schemas/L3Node"

    ProjectExport:
      type: object
      required: [project, l1Tags, l2Nodes, l3Nodes, commits, exportedAt]
      properties:
        project:
          $ref: "#/components/schemas/Project"
        l1Tags:
          type: array
          items:
            $ref: "#/components/schemas/L1Tag"
        l2Nodes:
          type: array
          items:
            $ref: "#/components/schemas/L2Node"
        l3Nodes:
          type: array
          items:
            $ref: "#/components/schemas/L3Node"
        commits:
          type: array
          items:
            $ref: "#/components/schemas/Commit"
        exportedAt:
          type: string

    L1Tag:
      type: object
      required: [id, name, category, usageCount, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        description:
          type: ["string", "null"]
        isAnchored:
          type: boolean
        usageCount:
          type: integer
        createdAt:
          type: string

    L1TagInput:
      type: object
      required: [name, category]
      properties:
        name:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
        description:
          type: string
        isAnchored:
          type: boolean

    L1TagUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        category:
          type: string
        description:
          type: string
        isAnchored:
          type: boolean

    L2Node:
      type: object
      required: [id, projectId, name, type, l3Count, l1TagIds, aiGenerated, createdAt]
      properties:
        id:
          type: integer
        projectId:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [package, module, pcd]
        description:
          type: ["string", "null"]
        l3Count:
          type: integer
        l1TagIds:
          type: array
          items:
            type: integer
        aiGenerated:
          type: boolean
        needsReview:
          type: boolean
        createdAt:
          type: string

    L2NodeInput:
      type: object
      required: [projectId, name, type]
      properties:
        projectId:
          type: integer
        name:
          type: string
          minLength: 1
        type:
          type: string
          enum: [package, module, pcd]
        description:
          type: string
        l1TagIds:
          type: array
          items:
            type: integer
        aiGenerated:
          type: boolean

    L2NodeUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        type:
          type: string
          enum: [package, module, pcd]
        description:
          type: string
        l1TagIds:
          type: array
          items:
            type: integer
        needsReview:
          type: boolean

    NodeLink:
      type: object
      required: [id, sourceNodeId, targetNodeId, linkType, createdAt]
      properties:
        id:
          type: integer
        sourceNodeId:
          type: integer
        targetNodeId:
          type: integer
        linkType:
          type: string
        sourceNodeName:
          type: ["string", "null"]
        targetNodeName:
          type: ["string", "null"]
        createdAt:
          type: string

    NodeLinkInput:
      type: object
      required: [targetNodeId]
      properties:
        targetNodeId:
          type: integer
        linkType:
          type: string

    L3Node:
      type: object
      required: [id, l2NodeId, title, nodeType, aiGenerated, createdAt]
      properties:
        id:
          type: integer
        l2NodeId:
          type: integer
        title:
          type: string
        content:
          type: ["string", "null"]
        nodeType:
          type: string
          enum: [change, rule, decision, context]
        commitHash:
          type: ["string", "null"]
        aiGenerated:
          type: boolean
        confidence:
          type: ["number", "null"]
        noiseScore:
          type: ["number", "null"]
        createdAt:
          type: string

    L3NodeInput:
      type: object
      required: [title, nodeType]
      properties:
        title:
          type: string
          minLength: 1
        content:
          type: string
        nodeType:
          type: string
          enum: [change, rule, decision, context]
        commitHash:
          type: string
        aiGenerated:
          type: boolean
        confidence:
          type: number

    L3NodeUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        content:
          type: string
        nodeType:
          type: string
          enum: [change, rule, decision, context]
        noiseScore:
          type: number

    Commit:
      type: object
      required: [id, projectId, hash, message, author, valid, createdAt]
      properties:
        id:
          type: integer
        projectId:
          type: integer
        hash:
          type: string
        message:
          type: string
        author:
          type: string
        valid:
          type: boolean
        filterScore:
          type: ["number", "null"]
        l2NodeId:
          type: ["integer", "null"]
        createdAt:
          type: string

    CommitInput:
      type: object
      required: [hash, message, author]
      properties:
        hash:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        author:
          type: string
          minLength: 1
        valid:
          type: boolean
        l2NodeId:
          type: integer

    ReviewTask:
      type: object
      required: [id, entityType, entityId, taskType, status, createdAt]
      properties:
        id:
          type: integer
        entityType:
          type: string
          enum: [l1_tag, l2_node, l3_node]
        entityId:
          type: integer
        taskType:
          type: string
          enum: [anchor, correct, validate, merge]
        status:
          type: string
          enum: [pending, approved, rejected, deferred]
        description:
          type: ["string", "null"]
        projectName:
          type: ["string", "null"]
        entityName:
          type: ["string", "null"]
        nodeContent:
          type: ["string", "null"]
        correctedValue:
          type: ["string", "null"]
        createdAt:
          type: string
        resolvedAt:
          type: ["string", "null"]

    ReviewResolution:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [approved, rejected, deferred]
        correctedValue:
          type: string

    ReviewStats:
      type: object
      required: [pending, approved, rejected, deferred, totalToday]
      properties:
        pending:
          type: integer
        approved:
          type: integer
        rejected:
          type: integer
        deferred:
          type: integer
        totalToday:
          type: integer

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    DocumentUploadInput:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: The document file to upload (max 10MB)
        docType:
          type: string
          enum: [pdf, docx, pptx, md]
          description: Document type (auto-detected from extension if omitted)
        commitSha:
          type: string
          description: Optional commit SHA to associate with this document

    Document:
      type: object
      required: [id, filename, docType, createdAt]
      properties:
        id:
          type: integer
        projectId:
          type: ["integer", "null"]
        filename:
          type: string
        docType:
          type: string
          enum: [markdown, txt, pdf, docx, pptx, build_artifact]
        content:
          type: string
        contentHash:
          type: ["string", "null"]
          description: SHA-256 hash of raw content
        affiliatedAt:
          type: ["string", "null"]
          description: ISO-8601 timestamp when document was associated with a project
        status:
          type: string
          enum: [unaffiliated, affiliated]
          default: unaffiliated
        createdAt:
          type: string

    DocumentIngestInput:
      type: object
      required: [filename, content]
      properties:
        filename:
          type: string
          minLength: 1
        content:
          type: string
          minLength: 1
        docType:
          type: string
          enum: [markdown, txt, pdf, docx, pptx, build_artifact]

    GitIngestInput:
      type: object
      properties:
        repoUrl:
          type: string
        branch:
          type: string
        limit:
          type: integer
          default: 100
        githubToken:
          type: string
        mode:
          type: string
          enum: [full, incremental]
          default: full

    GitIngestResult:
      type: object
      required: [commitsIngested, commitsSkipped, totalFetched]
      properties:
        commitsIngested:
          type: integer
        commitsSkipped:
          type: integer
        totalFetched:
          type: integer

    SvnIngestInput:
      type: object
      required:
        - svnUrl
      properties:
        svnUrl:
          type: string
          description: SVN repository URL (e.g. svn+ssh://... or https://...)
        username:
          type: string
          description: SVN username (optional)
        password:
          type: string
          description: SVN password (optional)
        startRevision:
          type: integer
          description: Starting revision number (optional, defaults to 1)
        endRevision:
          type: integer
          description: Ending revision number (optional, defaults to HEAD)
        mode:
          type: string
          enum: [full, incremental]
          default: full

    SvnIngestResult:
      type: object
      required:
        - ingested
        - skipped
        - errors
      properties:
        ingested:
          type: integer
        skipped:
          type: integer
        errors:
          type: array
          items:
            type: string

    GenerateInput:
      type: object
      properties:
        model:
          type: string
        maxCommits:
          type: integer
          default: 50
        mode:
          type: string
          enum: [full, incremental]
          default: full

    GenerateResult:
      type: object
      required:
        [l1TagsCreated, l2NodesCreated, l3NodesCreated, reviewTasksCreated, commitsProcessed]
      properties:
        l1TagsCreated:
          type: integer
        l2NodesCreated:
          type: integer
        l2NodesUpdated:
          type: integer
        l3NodesCreated:
          type: integer
        reviewTasksCreated:
          type: integer
        commitsProcessed:
          type: integer
        documentsUsed:
          type: integer

    IngestStatusResponse:
      type: object
      required: [projectId, vcsType, pendingCommits]
      properties:
        projectId:
          type: string
        vcsType:
          type: string
          enum: [git, svn]
        lastGitIngestedAt:
          type: ["string", "null"]
          description: ISO-8601 timestamp of last Git ingest, or null
        lastSvnRevision:
          type: ["integer", "null"]
          description: Last ingested SVN revision number, or null
        pendingCommits:
          type: integer
          description: Number of commits not yet processed

    PromptTemplate:
      type: object
      required: [templateType, systemPrompt, isCustom, isActive]
      properties:
        id:
          type: ["integer", "null"]
        templateType:
          type: string
          enum: [l1_tagger, l2_extractor, l3_generator]
        systemPrompt:
          type: string
        isCustom:
          type: boolean
        isActive:
          type: boolean
        updatedAt:
          type: ["string", "null"]

    PromptTemplateInput:
      type: object
      required: [systemPrompt]
      properties:
        systemPrompt:
          type: string
          minLength: 10

    LlmConfig:
      type: object
      required: [id, provider, model, createdAt]
      properties:
        id:
          type: integer
        projectId:
          type: ["integer", "null"]
        provider:
          type: string
        model:
          type: string
        isDefault:
          type: boolean
        createdAt:
          type: string

    LlmConfigInput:
      type: object
      properties:
        model:
          type: string
        provider:
          type: string

    SearchInput:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
        projectId:
          type: integer
        limit:
          type: integer
          default: 20

    SearchResponse:
      type: object
      required: [results, total]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultItem"
        total:
          type: integer

    SearchResultItem:
      type: object
      required: [nodeLayer, id, title, createdAt]
      properties:
        nodeLayer:
          type: string
          enum: [l1, l2, l3]
        id:
          type: integer
        title:
          type: string
        content:
          type: ["string", "null"]
        projectId:
          type: ["integer", "null"]
